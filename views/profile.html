<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ học viên - Ôn luyện Vật lí</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Styles -->
    <link rel="stylesheet" href="/css/style.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    
    <style>
        /* Additional styles for chart theming */
        .chart-container canvas {
            max-height: 350px;
        }
        
        /* Score display styles */
        .history-score {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            min-width: 150px;
            justify-content: flex-end;
        }
        
        .history-score strong {
            font-size: 1.1rem;
            color: var(--text-primary);
        }
        
        .score-percentage {
            font-size: 0.9rem;
            font-weight: 700;
            min-width: 45px;
            text-align: right;
        }
        
        /* Score wrapper for side-by-side layout */
        .history-score-wrapper {
            display: flex;
            align-items: center;
            gap: 1rem;
            justify-content: flex-end;
        }
        
        .history-elo-change {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.8rem 1rem;
            border-radius: 6px;
            font-weight: 700;
            min-width: 70px;
            height: 100%;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            font-size: 0.95rem;
        }
        
        .history-elo-change.positive {
            color: #5db896;
            border-color: rgba(93, 184, 150, 0.3);
            background: rgba(93, 184, 150, 0.05);
        }
        
        .history-elo-change.negative {
            color: #c06565;
            border-color: rgba(192, 101, 101, 0.3);
            background: rgba(192, 101, 101, 0.05);
        }
        
        .history-elo-change i {
            font-size: 0.8rem;
        }
        
        .history-score.score-excellent {
            background: linear-gradient(135deg, #5db896, #4a9d6f);
            box-shadow: 0 4px 12px rgba(93, 184, 150, 0.15);
        }
        
        .history-score.score-excellent .score-percentage {
            color: #ffffff;
        }
        
        .history-score.score-good {
            background: linear-gradient(135deg, #7ab87f, #6ba86f);
            box-shadow: 0 4px 12px rgba(107, 168, 111, 0.15);
        }
        
        .history-score.score-good .score-percentage {
            color: #ffffff;
        }
        
        .history-score.score-fair {
            background: linear-gradient(135deg, #b8903d, #a87d32);
            box-shadow: 0 4px 12px rgba(184, 144, 61, 0.15);
        }
        
        .history-score.score-fair .score-percentage {
            color: #ffffff;
        }
        
        .history-score.score-poor {
            background: linear-gradient(135deg, #c06565, #b85a5a);
            box-shadow: 0 4px 12px rgba(192, 101, 101, 0.15);
        }
        
        .history-score.score-poor .score-percentage {
            color: #ffffff;
        }
        
        /* Mobile responsive */
        @media (max-width: 768px) {
            .profile-header {
                flex-direction: column;
                text-align: center;
            }
            
            .profile-avatar {
                width: 80px;
                height: 80px;
                font-size: 2.5rem;
            }
            
            .profile-info h1 {
                font-size: 2rem;
            }
            
            .history-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            
            .history-change {
                align-self: flex-end;
            }
            
            .history-score {
                align-self: flex-end;
            }
            
            .history-score-wrapper {
                flex-direction: column;
                gap: 0.5rem;
            }
            
            .chart-container {
                height: 250px;
            }
            
            .rating-tiers {
                display: none;
            }
            
            .mobile-tier-container {
                display: block;
                overflow-x: auto;
                white-space: nowrap;
                padding-bottom: 1rem;
                margin-bottom: 1.5rem;
            }
            
            .mobile-tier-container .rating-tiers {
                display: inline-flex;
                flex-wrap: nowrap;
            }
        }
        
        @media (min-width: 769px) {
            .mobile-tier-container {
                display: none;
            }
        }
    </style>
    <script src="/js/nav-mobile.js"></script>
</head>
<body>
    <!-- Loading Indicator -->
    <div id="loading-indicator" class="loading-indicator">
        <div class="spinner"></div>
        <p>Đang tải hồ sơ...</p>
    </div>

    <!-- Background Animation -->
    <canvas id="network-canvas"></canvas>
    
    <!-- Navigation -->
    <nav class="main-nav">
        <div class="nav-container">
            <a href="/" class="nav-logo">
                <i class="fas fa-atom"></i>
                <span>Học Vật Lý</span>
            </a>
            
            <div class="nav-links" id="nav-links">
                <a href="/lessons" class="nav-link">
                    <i class="fas fa-book"></i>
                    <span>Bài học</span>
                </a>
                <a href="/study-materials" class="nav-link">
                    <i class="fas fa-book-open"></i>
                    <span>Lý thuyết</span>
                </a>
                <a href="/leaderboard" class="nav-link">
                    <i class="fas fa-trophy"></i>
                    <span>Bảng xếp hạng</span>
                </a>
                <a href="/profile" class="nav-link active" id="profile-link">
                    <i class="fas fa-user"></i>
                    <span>Hồ sơ</span>
                </a>
            </div>
            
            <button class="mobile-menu-toggle" id="mobile-menu-toggle">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </nav>
    
    <div class="profile-container" id="profile-data">
        <!-- Profile content will be loaded here -->
    </div>

    <script src="/js/network-animation.js"></script>
    <script>
        // Define rating tiers
        const ratingTiers = [
            { name: "Newbie", min: 0, max: 1200, color: "#808080" },
            { name: "Học viên", min: 1200, max: 1400, color: "#43e97b" },
            { name: "Chuyên cần", min: 1400, max: 1600, color: "#3b82f6" },
            { name: "Giỏi", min: 1600, max: 1900, color: "#a855f7" },
            { name: "Xuất sắc", min: 1900, max: 2200, color: "#f59e0b" },
            { name: "Master", min: 2200, max: 3000, color: "#ef4444" }
        ];
        
        // Get rating tier color
        function getRatingColor(rating) {
            for (const tier of ratingTiers) {
                if (rating >= tier.min && rating <= tier.max) {
                    return tier.color;
                }
            }
            return "#808080";
        }
        
        // Get rating tier name
        function getRatingTier(rating) {
            for (const tier of ratingTiers) {
                if (rating >= tier.min && rating <= tier.max) {
                    return tier.name;
                }
            }
            return "Unrated";
        }

        const TARGET_TZ_OFFSET_MS = 7 * 60 * 60 * 1000; // UTC+7

        function parseUtcDate(dateInput) {
            if (dateInput instanceof Date) return dateInput;
            if (typeof dateInput === 'string') {
                const trimmed = dateInput.trim();
                const hasTimezone = /[zZ]|[+-]\d{2}:\d{2}$/.test(trimmed);
                const normalized = hasTimezone ? trimmed : `${trimmed}Z`;
                const parsed = new Date(normalized);
                if (!isNaN(parsed.getTime())) return parsed;
            }
            return new Date(dateInput);
        }

        function toUtcPlus7Date(dateInput) {
            const date = parseUtcDate(dateInput);
            if (isNaN(date.getTime())) return null;
            return new Date(date.getTime() + TARGET_TZ_OFFSET_MS);
        }

        function formatUtcPlus7DateTime(dateInput) {
            const shiftedDate = toUtcPlus7Date(dateInput);
            if (!shiftedDate) return 'N/A';
            return shiftedDate.toLocaleString('vi-VN', {
                timeZone: 'UTC',
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function formatUtcPlus7DateOnly(dateInput) {
            const shiftedDate = toUtcPlus7Date(dateInput);
            if (!shiftedDate) return 'N/A';
            return shiftedDate.toLocaleDateString('vi-VN', {
                timeZone: 'UTC',
                day: '2-digit',
                month: '2-digit',
                year: 'numeric'
            });
        }
        
        async function loadProfile() {
            console.log('[Profile Debug] loadProfile called');
            const profileContainer = document.getElementById('profile-data');
            const pathParts = window.location.pathname.split('/');
            const studentId = pathParts[pathParts.length - 1];
            const loadingIndicator = document.getElementById('loading-indicator');

            console.log('[Profile Debug] URL analysis:', {
                pathname: window.location.pathname,
                pathParts,
                studentId
            });

            // Check if we have a specific student ID in the URL or if we're accessing current student profile
            const isCurrentStudent = !studentId || studentId === 'profile';

            console.log('[Profile Debug] isCurrentStudent:', isCurrentStudent);

            try {
                let response;
                const cacheBuster = `_t=${Date.now()}`;
                if (isCurrentStudent) {
                    console.log('[Profile Debug] Fetching current student profile');
                    // Get current student's profile
                    response = await fetch(`/api/students/profile?${cacheBuster}`, {
                        cache: 'no-store',
                        headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate' }
                    });
                } else {
                    console.log('[Profile Debug] Fetching specific student profile:', studentId);
                    // Get specific student's profile
                    response = await fetch(`/api/students/${studentId}/profile?${cacheBuster}`, {
                        cache: 'no-store',
                        headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate' }
                    });
                }

                console.log('[Profile Debug] Response received:', response.status, response.ok);
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `Lỗi ${response.status}`);
                }

                const data = await response.json();
                
                // Fetch progress data if current student
                let progressData = null;
                if (isCurrentStudent) {
                    try {
                        const progressResponse = await fetch('/api/progress/overview');
                        if (progressResponse.ok) {
                            const progressResult = await progressResponse.json();
                            progressData = progressResult.progress;
                        }
                    } catch (error) {
                        console.error('Error fetching progress:', error);
                    }
                }

                // Render Profile
                let profileHTML = `
                    <div class="profile-header">
                        <div class="profile-avatar">${data.profile.student.full_name?.[0]?.toUpperCase() || '?'}</div>
                        <div class="profile-info">
                            <h1>${data.profile.student.full_name || 'Vô danh'}</h1>
                            <p class="profile-rating">
                                <i class="fas fa-star"></i> ${Math.round(data.profile.rating?.rating || 1500)} điểm
                                <span style="color: ${getRatingColor(data.profile.rating?.rating || 1500)}; font-weight: 700;"> (${getRatingTier(data.profile.rating?.rating || 1500)})</span>
                            </p>
                            <p><i class="fas fa-calendar-alt"></i> Tham gia: ${formatUtcPlus7DateOnly(data.profile.student.created_at)}</p>
                        </div>
                    </div>
                `;
                
                // Add action buttons for current student
                if (isCurrentStudent) {
                    profileHTML += `<div class="profile-actions" style="margin: 1.5rem 0; display: flex; gap: 1rem; flex-wrap: wrap;">`;
                    
                    // Continue Learning button if there's an incomplete lesson
                    if (progressData && progressData.lastIncompleteLesson) {
                        profileHTML += `
                            <a href="/lesson/last-incomplete" class="action-btn" style="
                                display: inline-flex;
                                align-items: center;
                                gap: 0.5rem;
                                padding: 0.75rem 1.5rem;
                                background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
                                color: white;
                                border-radius: 12px;
                                text-decoration: none;
                                font-weight: 600;
                                transition: transform 0.2s, box-shadow 0.2s;
                            " onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 4px 12px rgba(99, 102, 241, 0.4)';" 
                               onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='none';">
                                <i class="fas fa-play-circle"></i>
                                Tiếp tục học: ${progressData.lastIncompleteLesson.title}
                            </a>
                        `;
                    }
                    
                    // Review Mistakes button if there are mistakes
                    if (progressData && progressData.mistakesCount > 0) {
                        profileHTML += `
                            <a href="/personalized-quiz" class="action-btn" style="
                                display: inline-flex;
                                align-items: center;
                                gap: 0.5rem;
                                padding: 0.75rem 1.5rem;
                                background: linear-gradient(135deg, #6d5ef5, #5142c9);
                                color: white;
                                border-radius: 12px;
                                text-decoration: none;
                                font-weight: 600;
                                transition: transform 0.2s, box-shadow 0.2s;
                            " onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 4px 12px rgba(109, 94, 245, 0.4)';"
                               onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='none';">
                                <i class="fas fa-wand-magic-sparkles"></i>
                                Tạo đề cá nhân hoá
                            </a>
                        `;
                        profileHTML += `
                            <a href="/review-mistakes" class="action-btn" style="
                                display: inline-flex;
                                align-items: center;
                                gap: 0.5rem;
                                padding: 0.75rem 1.5rem;
                                background: linear-gradient(135deg, #f59e0b, #d97706);
                                color: white;
                                border-radius: 12px;
                                text-decoration: none;
                                font-weight: 600;
                                transition: transform 0.2s, box-shadow 0.2s;
                            " onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 4px 12px rgba(245, 158, 11, 0.4)';" 
                               onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='none';">
                                <i class="fas fa-exclamation-triangle"></i>
                                Ôn tập lỗi sai (${progressData.mistakesCount})
                            </a>
                        `;
                    }
                    
                    // Settings button - always available for current student
                    profileHTML += `
                        <a href="/settings" class="action-btn" style="
                            display: inline-flex;
                            align-items: center;
                            gap: 0.5rem;
                            padding: 0.75rem 1.5rem;
                            background: linear-gradient(135deg, #667eea, #764ba2);
                            color: white;
                            border-radius: 12px;
                            text-decoration: none;
                            font-weight: 600;
                            transition: transform 0.2s, box-shadow 0.2s;
                        " onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 4px 12px rgba(102, 126, 234, 0.4)';" 
                           onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='none';">
                            <i class="fas fa-cog"></i>
                            Cài đặt
                        </a>
                    `;
                    
                    profileHTML += `</div>`;
                }
                
                // Add Rating Chart Section
                profileHTML += `
                    <div class="profile-section">
                        <h2><i class="fas fa-chart-line"></i> Biểu đồ điểm số</h2>
                        <div class="rating-tiers">
                            ${ratingTiers.map(tier => 
                                `<div class="rating-tier">
                                    <div class="tier-color" style="background-color: ${tier.color}"></div>
                                    <span>${tier.name} (${tier.min}-${tier.max})</span>
                                </div>`
                            ).join('')}
                        </div>
                        <div class="mobile-tier-container">
                            <div class="rating-tiers">
                                ${ratingTiers.map(tier => 
                                    `<div class="rating-tier">
                                        <div class="tier-color" style="background-color: ${tier.color}"></div>
                                        <span>${tier.name}</span>
                                    </div>`
                                ).join('')}
                            </div>
                        </div>
                `;
                
                if (data.profile.ratingHistory && data.profile.ratingHistory.length > 0) {
                    profileHTML += `<div class="chart-container"><canvas id="ratingChart"></canvas></div>`;
                } else {
                    profileHTML += `<div class="no-data">Chưa có dữ liệu điểm số để hiển thị biểu đồ.</div>`;
                }
                
                profileHTML += `</div>`;

                // Render Rating History
                if (data.profile.ratingHistory && data.profile.ratingHistory.length > 0) {
                    profileHTML += `
                        <div class="profile-section">
                            <h2><i class="fas fa-history"></i> Lịch sử làm bài</h2>
                            <ul class="rating-history-list">
                    `;
                    data.profile.ratingHistory.forEach(item => {
                        // Display quiz score if available, otherwise show rating change
                        let scoreDisplay = '';
                        let scoreClass = '';
                        
                        if (item.quiz_score !== undefined && item.quiz_score !== null) {
                            const percentage = item.quiz_percentage || 0;
                            // Color coding based on score
                            if (percentage >= 80) scoreClass = 'score-excellent';
                            else if (percentage >= 60) scoreClass = 'score-good';
                            else if (percentage >= 40) scoreClass = 'score-fair';
                            else scoreClass = 'score-poor';
                            
                            // Get ELO change
                            let change = item.rating_change;
                            if (change === undefined || change === null) {
                                const prevRating = item.previous_rating || 0;
                                const newRating = item.new_rating || 0;
                                change = newRating - prevRating;
                            }
                            
                            const changeClass = change > 0 ? 'positive' : change < 0 ? 'negative' : '';
                            const changeSymbol = change > 0 ? '+' : '';
                            
                            scoreDisplay = `
                                <div class="history-score-wrapper">
                                    <div class="history-elo-change ${changeClass}">
                                        ${changeSymbol}${change}
                                        <i class="fas fa-arrow-${change > 0 ? 'up' : 'down'}"></i>
                                    </div>
                                    <div class="history-score ${scoreClass}">
                                        <strong>${item.quiz_score.toFixed(1)} / ${item.quiz_total_points.toFixed(1)}</strong>
                                        <span class="score-percentage">${percentage}%</span>
                                    </div>
                                </div>
                            `;
                        } else {
                            // Fallback to rating change if no quiz score available
                            let change = item.rating_change;
                            if (change === undefined || change === null) {
                                const prevRating = item.previous_rating || 0;
                                const newRating = item.new_rating || 0;
                                change = newRating - prevRating;
                            }
                            
                            const changeClass = change > 0 ? 'positive' : change < 0 ? 'negative' : '';
                            const changeSymbol = change > 0 ? '+' : '';
                            scoreDisplay = `
                                <div class="history-change ${changeClass}">
                                    ${changeSymbol}${change}
                                    <i class="fas fa-arrow-${change > 0 ? 'up' : 'down'}"></i>
                                    (${Math.round(item.new_rating)})
                                </div>
                            `;
                        }
                        
                        profileHTML += `
                            <li class="history-item">
                                <div class="history-details">
                                    <strong>${item.lesson_title || `Bài học ID: ${item.lesson_id}`}</strong> 
                                    <span><i class="fas fa-clock"></i> ${formatUtcPlus7DateTime(item.timestamp)}</span>
                                </div>
                                ${scoreDisplay}
                            </li>
                        `;
                    });
                    profileHTML += '</ul></div>';
                } else {
                    profileHTML += `
                        <div class="profile-section">
                            <h2><i class="fas fa-history"></i> Lịch sử làm bài</h2>
                            <div class="no-data">Chưa có Lịch sử làm bài.</div>
                        </div>
                    `;
                }
                
                profileContainer.innerHTML = profileHTML;
                
                // Hide loading indicator
                loadingIndicator.style.display = 'none';
                
                // Create Rating Chart if data exists (with small delay to ensure DOM is updated)
                if (data.profile.ratingHistory && data.profile.ratingHistory.length > 0) {
                    setTimeout(() => {
                        createRatingChart(data.profile.ratingHistory);
                    }, 100);
                }

            } catch (error) {
                console.error("Error loading profile:", error);
                profileContainer.innerHTML = `<div class="error-message"><i class="fas fa-exclamation-triangle"></i> Không thể tải hồ sơ: ${error.message}</div>`;
                loadingIndicator.style.display = 'none';
            }
        }
        
        function createRatingChart(historyData) {
            // Ensure history is sorted by timestamp
            historyData.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
            
            // Calculate rating changes if not provided
            historyData.forEach((item, index) => {
                if (item.rating_change === undefined || item.rating_change === null) {
                    if (index === 0) {
                        const startingRating = item.previous_rating || 1500;
                        item.rating_change = (item.new_rating || 0) - startingRating;
                    } else {
                        const prevRating = historyData[index - 1].new_rating || 0;
                        item.rating_change = (item.new_rating || 0) - prevRating;
                    }
                }
            });
            
            // Format data for chart
            const labels = historyData.map(item => {
                const date = toUtcPlus7Date(item.timestamp);
                if (!date) return '';
                return date.toLocaleDateString('vi-VN', { timeZone: 'UTC', day: 'numeric', month: 'numeric' });
            });
            
            const ratings = historyData.map(item => Math.round(item.new_rating || 1500));
            const pointColors = historyData.map(item => getRatingColor(item.new_rating || 1500));
            
            // Add starting point
            if (historyData.length > 0) {
                const firstEntry = historyData[0];
                const startingRating = firstEntry.previous_rating || 
                                      (Math.round(firstEntry.new_rating) - firstEntry.rating_change) || 
                                      1500;
                
                const firstDate = toUtcPlus7Date(firstEntry.timestamp);
                if (firstDate) {
                    firstDate.setUTCDate(firstDate.getUTCDate() - 1);
                    labels.unshift(firstDate.toLocaleDateString('vi-VN', { timeZone: 'UTC', day: 'numeric', month: 'numeric' }));
                } else {
                    labels.unshift('');
                }
                ratings.unshift(startingRating);
                pointColors.unshift(getRatingColor(startingRating));
            }
            
            // Chart configuration
            const canvasElement = document.getElementById('ratingChart');
            if (!canvasElement) {
                console.error('Canvas element with id "ratingChart" not found');
                return;
            }
            const ctx = canvasElement.getContext('2d');
            
            const chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Điểm số',
                        data: ratings,
                        fill: false,
                        borderColor: '#a855f7',
                        tension: 0.1,
                        pointBackgroundColor: pointColors,
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2,
                        pointRadius: 6,
                        pointHoverRadius: 8,
                        borderWidth: 3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        tooltip: {
                            backgroundColor: 'rgba(10, 10, 15, 0.9)',
                            borderColor: 'rgba(168, 85, 247, 0.5)',
                            borderWidth: 1,
                            titleColor: '#fff',
                            bodyColor: '#b8bcc8',
                            padding: 12,
                            displayColors: false,
                            callbacks: {
                                title: function(tooltipItems) {
                                    const idx = tooltipItems[0].dataIndex;
                                    if (idx === 0 && idx < historyData.length) {
                                        return 'Điểm ban đầu';
                                    } else {
                                        const historyIdx = idx - 1 >= 0 ? idx - 1 : 0;
                                        const item = historyData[historyIdx];
                                        return item ? (item.lesson_title || `Bài học ID: ${item.lesson_id}`) : '';
                                    }
                                },
                                label: function(context) {
                                    const rating = context.raw;
                                    return `Điểm: ${rating} (${getRatingTier(rating)})`;
                                },
                                afterLabel: function(context) {
                                    const idx = context.dataIndex;
                                    if (idx > 0 && idx - 1 < historyData.length) {
                                        const change = historyData[idx - 1].rating_change;
                                        if (change && change !== 0) {
                                            const sign = change > 0 ? '+' : '';
                                            return `Thay đổi: ${sign}${change}`;
                                        }
                                    }
                                    return '';
                                }
                            }
                        },
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            title: {
                                display: true,
                                text: 'Điểm số',
                                color: '#b8bcc8'
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.05)'
                            },
                            ticks: {
                                color: '#b8bcc8'
                            }
                        },
                        x: {
                            grid: {
                                display: false
                            },
                            ticks: {
                                color: '#b8bcc8',
                                maxRotation: 45,
                                minRotation: 45
                            }
                        }
                    }
                }
            });
        }

        document.addEventListener('DOMContentLoaded', loadProfile);
        
        // Mobile menu toggle functionality
        const mobileMenuToggle = document.getElementById('mobile-menu-toggle');
        const navLinks = document.getElementById('nav-links');
        
        if (mobileMenuToggle && navLinks) {
            mobileMenuToggle.addEventListener('click', () => {
                navLinks.classList.toggle('active');
            });
        }
    </script>
</body>
</html>
